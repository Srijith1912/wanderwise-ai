name: Keep backend warm

# Render's free tier spins the backend down after ~15 min idle, causing a
# 30-60s cold start on the next real request. Pinging a lightweight route
# every 10 min keeps it warm. GitHub auto-disables scheduled workflows after
# 60 days with no repo commits — re-enable from the Actions tab if that happens.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: curl -sf --max-time 90 https://wanderwise-ai-backend.onrender.com/api/test
